name: Finalize MyTV PO decisions

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.head_commit.message == 'Trigger final MyTV PO decisions'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply C166-C169
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def repl(path, old, new, expected=1):
              p = Path(path)
              t = p.read_text(encoding='utf-8')
              n = t.count(old)
              if expected is not None and n != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {n}: {old[:100]!r}')
              p.write_text(t.replace(old, new), encoding='utf-8')

          # C166 — Nickname quota 1 successful change / 24h / account.
          p='EP01_TRAI_NGHIEM_BINH_LUAN_VA_DANH_GIA/US04_DANG_BINH_LUAN.md'
          repl(p,
               '10. User được đổi nickname theo giới hạn quota đổi tên (xem Quy tắc nghiệp vụ); nickname mới/đổi phải qua **global AI moderation policy độc lập với Chế độ 1/2 của phim/tập**, chỉ có **2 kết quả**: Nhẹ/An toàn → dùng ngay, cập nhật nickname công khai ngay lập tức; Trung bình HOẶC Nặng (gộp) → **bị chặn ngay lập tức tại thời điểm submit**, không tạo bất kỳ trạng thái chờ duyệt nào.',
               '10. User được đổi nickname tối đa **1 lần/24 giờ/account**; nickname mới/đổi phải qua **global AI moderation policy độc lập với Chế độ 1/2 của phim/tập**, chỉ có **2 kết quả**: Nhẹ/An toàn → dùng ngay, cập nhật nickname công khai ngay lập tức; Trung bình HOẶC Nặng (gộp) → **bị chặn ngay lập tức tại thời điểm submit**, không tạo bất kỳ trạng thái chờ duyệt nào.')
          repl(p,
               '- Đổi nickname có quota riêng: tối đa **1 lần đổi nickname/24 giờ**. ⚠️ **CẦN PO XÁC NHẬN:** con số "1 lần/24 giờ" là đề xuất hợp lý để lấp khoảng trống rate-limit cho nickname (không nằm trong 4 quyết định đã chốt) — cần PO xác nhận số lần và cửa sổ thời gian cụ thể, hoặc có thể dùng số khác (ví dụ 3 lần/ngày) tùy mức độ lo ngại về lạm dụng đổi tên.',
               '- Đổi nickname có quota riêng: tối đa **1 lần đổi nickname thành công/24 giờ/account**. Quota được tính khi nickname mới vượt qua validation + global AI policy và được hệ thống chấp nhận lưu; submission bị validation/AI chặn không tiêu quota.')
          repl(p,
               '| TC-US04-018 | XSS payload | Payload `<script>alert(1)</script>`, `<img src=x onerror=alert(1)>`, `javascript:alert(1)` gửi làm nội dung comment và làm nickname | Gửi qua UI/API, sau đó hiển thị lại trên mọi bề mặt (danh sách comment, thông báo, CMS) | Payload được escape/sanitize ở mọi nơi hiển thị, không thực thi script; xem thêm ../REQUIREMENTS_A11Y_SECURITY.md. |',
               '| TC-US04-018 | XSS payload | Payload `<script>alert(1)</script>`, `<img src=x onerror=alert(1)>`, `javascript:alert(1)` gửi làm nội dung comment và làm nickname | Gửi qua UI/API, sau đó hiển thị lại trên mọi bề mặt (danh sách comment, thông báo, CMS) | Payload được escape/sanitize ở mọi nơi hiển thị, không thực thi script; xem thêm ../REQUIREMENTS_A11Y_SECURITY.md. |\n| TC-US04-019 | Nickname quota | U1 chưa đổi nickname trong 24h | Đổi nickname hợp lệ thành công, sau đó thử đổi lần 2 trước 24h; thử lại sau đủ 24h; kiểm tra thêm một submission bị validation/AI chặn | Lần đổi thành công đầu được lưu; lần đổi thành công thứ 2 trong 24h bị chặn; sau đủ 24h được đổi lại. Submission bị validation/AI chặn không tiêu quota. |')

          # C167 — Edit rate limit 5/minute/target.
          p='EP01_TRAI_NGHIEM_BINH_LUAN_VA_DANH_GIA/US05_SUA_VA_XOA_BINH_LUAN.md'
          repl(p,
               '13. Khi user self-delete root làm reply của user khác bị cascade soft-delete (mang cờ `hidden_by_root_cascade = true`), các reply đó được coi là **đã Xóa mềm** cho eligibility của badge/KPI; không giữ contribution badge chỉ vì tác giả reply không phải người xóa root.',
               '13. Khi user self-delete root làm reply của user khác bị cascade soft-delete (mang cờ `hidden_by_root_cascade = true`), các reply đó được coi là **đã Xóa mềm** cho eligibility của badge/KPI; không giữ contribution badge chỉ vì tác giả reply không phải người xóa root.\n14. Mỗi comment/reply áp dụng **rate limit Edit riêng tối đa 5 lần sửa/phút/target**; lần sửa vượt ngưỡng bị chặn trước khi tạo version mới hoặc gọi AI moderation.')
          repl(p,
               '- Pending edit gửi trước sanction không bị hồi tố hủy chỉ vì Khóa bình luận có hiệu lực sau đó.',
               '- Pending edit gửi trước sanction không bị hồi tố hủy chỉ vì Khóa bình luận có hiệu lực sau đó.\n- Edit rate limit được tính riêng cho từng comment/reply: tối đa **5 edit/phút/target**; không dùng chung quota Comment+Reply của US04.')
          repl(p,
               '| TC-US05-017 | Concurrency race edit vs approve | C1 có V2 Chờ duyệt | U1 gửi V3 đúng lúc Admin bấm Duyệt V2 | Chỉ đúng 1 version được public ở thời điểm cuối cùng và có nhãn “Đã chỉnh sửa”; không có 2 version cùng public hoặc xung đột dữ liệu; version history đầy đủ V1→V2→V3 (kể cả version bị vô hiệu hóa do race) vẫn được ghi nhận cho CMS/Audit. |',
               '| TC-US05-017 | Concurrency race edit vs approve | C1 có V2 Chờ duyệt | U1 gửi V3 đúng lúc Admin bấm Duyệt V2 | Chỉ đúng 1 version được public ở thời điểm cuối cùng và có nhãn “Đã chỉnh sửa”; không có 2 version cùng public hoặc xung đột dữ liệu; version history đầy đủ V1→V2→V3 (kể cả version bị vô hiệu hóa do race) vẫn được ghi nhận cho CMS/Audit. |\n| TC-US05-018 | Edit rate limit | U1 sở hữu C1 và R1 | Thực hiện 5 edit hợp lệ trên C1 trong 1 phút rồi gửi edit thứ 6; lặp lại độc lập trên R1 | 5 edit đầu có thể được nhận theo moderation; edit thứ 6 trên cùng target bị chặn trước khi tạo version/gọi AI. Quota của C1 và R1 độc lập. |')

          p='EP03_AN_TOAN_VA_KIEM_DUYET/US11_AI_KIEM_DUYET_THEO_HAI_CHE_DO.md'
          repl(p,
               '- Edit (version sửa) áp dụng rate limit riêng: tối đa **{5} lần sửa/phút/comment**.\n\n> ⚠️ **CẦN PO XÁC NHẬN:** con số {5} lần sửa/phút/comment ở trên là đề xuất lấp khoảng trống — AC1 yêu cầu mọi version sửa đều qua AI nhưng README/US04 hiện chỉ giới hạn rate limit cho Comment/Reply gốc, không có giới hạn riêng cho Edit (một user có thể sửa liên tục cùng một comment hàng trăm lần/phút, tạo hàng trăm lần gọi AI và hàng trăm item vào queue mà không vi phạm rate limit nào hiện có). Đây không nằm trong 4 quyết định đã chốt, cần PO xác nhận ngưỡng cụ thể.',
               '- Edit (version sửa) áp dụng rate limit riêng: tối đa **5 lần sửa/phút/comment hoặc reply**, tính độc lập theo từng target; request vượt ngưỡng bị chặn trước khi gọi AI/tạo queue item.')
          repl(p,
               '| TC-US11-013 | Edit rate limit | U1 có 1 comment C1 | Gửi liên tục nhiều version sửa C1 vượt ngưỡng {5} lần/phút | Các lần sửa vượt ngưỡng bị chặn; không gọi AI/tạo queue item tương ứng. ⚠️ Ngưỡng cụ thể chờ PO xác nhận. |',
               '| TC-US11-013 | Edit rate limit | U1 có C1/R1 | Gửi 5 version sửa trên cùng target trong 1 phút rồi gửi lần thứ 6 | 5 lần đầu đi qua pipeline moderation bình thường; lần thứ 6 trên cùng target bị chặn trước khi gọi AI/tạo queue item. C1 và R1 có quota độc lập. |')

          # C168 — MyTV hotline hard-coded for Account Lock appeal.
          p='EP04_CMS_QUAN_TRI_BINH_LUAN/US16_QUAN_LY_NGUOI_DUNG_VI_PHAM_VA_AUDIT_LOG.md'
          pairs=[
          ('6. Với Khóa tài khoản, login phải dừng ở **locked-account screen** hiển thị trạng thái khóa, reason và hướng dẫn **gọi Support/CSKH để appeal**; có thể gửi push nếu device nhận được nhưng không phụ thuộc Notification Center trong app.',
           '6. Với Khóa tài khoản, login phải dừng ở **locked-account screen** hiển thị trạng thái khóa, reason và hướng dẫn **gọi Tổng đài MyTV 1800 1166 (miễn phí, hỗ trợ 24/7) để appeal**; có thể gửi push nếu device nhận được nhưng không phụ thuộc Notification Center trong app.'),
          ('2. **Khóa tài khoản**: user không thể appeal trong app; user **gọi MyTV Support/CSKH**, Support tiếp nhận và chuyển appeal vào workflow CMS.',
           '2. **Khóa tài khoản**: user không thể appeal trong app; user **gọi Tổng đài MyTV 1800 1166 (miễn phí, hỗ trợ 24/7)**, Support/CSKH tiếp nhận và chuyển appeal vào workflow CMS.'),
          ('- Appeal Account Lock đi qua Support/CSKH → CMS vì user không thể vào app; SLA 48h vẫn giữ.',
           '- Appeal Account Lock đi qua **Tổng đài MyTV 1800 1166 (miễn phí, hỗ trợ 24/7) → Support/CSKH → CMS** vì user không thể vào app; SLA 48h vẫn giữ.'),
          ('| TC-US16-011 | Access while locked | U1 đang Account Lock | Thử login/vào app | Không vào app; locked-account screen hiển thị status + reason + hướng dẫn gọi Support/CSKH. |',
           '| TC-US16-011 | Access while locked | U1 đang Account Lock | Thử login/vào app | Không vào app; locked-account screen hiển thị status + reason + Tổng đài MyTV **1800 1166**, thông tin **miễn phí, hỗ trợ 24/7** và hướng dẫn appeal. |'),
          ('| TC-US16-026 | Account-lock appeal | U1 bị Account Lock | Gọi Support/CSKH; Support tạo/chuyển appeal vào CMS | Không cần vào app; CMS nhận appeal đúng user/sanction/source và Admin xử lý. |',
           '| TC-US16-026 | Account-lock appeal | U1 bị Account Lock | Gọi **1800 1166**; Support/CSKH tạo/chuyển appeal vào CMS | Không cần vào app; hotline hiển thị là **1800 1166 (miễn phí, hỗ trợ 24/7)**; CMS nhận appeal đúng user/sanction/source và Admin xử lý. |'),
          ('| Locked-account screen | **Tài khoản của bạn đang bị khóa**<br>Lý do: {reason}. Thời hạn: đến {dd/mm/yyyy hh:mm} (hoặc: Khóa vô thời hạn). Nếu bạn cho rằng đây là nhầm lẫn, hãy gọi tổng đài MyTV {hotline} ({giờ trực}) và cung cấp mã vụ việc: {CASE-ID}. Chúng tôi phản hồi trong vòng 48 giờ kể từ khi tiếp nhận.<br>`[Gọi tổng đài]` `[Sao chép mã vụ việc]` |',
           '| Locked-account screen | **Tài khoản của bạn đang bị khóa**<br>Lý do: {reason}. Thời hạn: đến {dd/mm/yyyy hh:mm} (hoặc: Khóa vô thời hạn). **Liên hệ Tổng đài MyTV 1800 1166 (miễn phí, hỗ trợ 24/7) để gửi yêu cầu khiếu nại.** Khi liên hệ, cung cấp mã vụ việc: {CASE-ID}. Chúng tôi phản hồi trong vòng 48 giờ kể từ khi tiếp nhận.<br>`[Gọi 1800 1166]` `[Sao chép mã vụ việc]` |'),
          ('> ⚠️ **CẦN PO XÁC NHẬN:** Số hotline và giờ trực cụ thể của tổng đài MyTV Support/CSKH — chưa có trong tài liệu gốc, cần PO/CSKH cung cấp để điền vào microcopy locked-account screen.\n','')]
          for a,b in pairs: repl(p,a,b)

          p='EP02_TUONG_TAC_CONG_DONG/US09_MENTION_VA_NHAN_THONG_BAO.md'
          pairs=[
          ('15. Với **Account Lock**, user không vào được MyTV; lần đăng nhập phải vào màn hình tài khoản bị khóa hiển thị **trạng thái khóa + reason + hướng dẫn gọi Support/CSKH để appeal**. Có thể gửi push nếu thiết bị nhận được; không phụ thuộc vào việc user đọc in-app Notification Center.',
           '15. Với **Account Lock**, user không vào được MyTV; lần đăng nhập phải vào màn hình tài khoản bị khóa hiển thị **trạng thái khóa + reason + Tổng đài MyTV 1800 1166 (miễn phí, hỗ trợ 24/7) để appeal**. Có thể gửi push nếu thiết bị nhận được; không phụ thuộc vào việc user đọc in-app Notification Center.'),
          ('- Account Lock là ngoại lệ truy cập: **màn hình locked-account + Support/CSKH** là kênh chính; in-app Notification Center không được coi là kênh bắt buộc vì user không thể vào app.',
           '- Account Lock là ngoại lệ truy cập: **màn hình locked-account + Tổng đài MyTV 1800 1166 (miễn phí, hỗ trợ 24/7)** là kênh chính; in-app Notification Center không được coi là kênh bắt buộc vì user không thể vào app.'),
          ('| TC-US09-013 | Locked-account notice | U2 bị Account Lock | U2 thử đăng nhập; kiểm tra push nếu thiết bị cho phép | Không vào app; thấy lock status + reason + hướng dẫn gọi Support/CSKH; push có thể được gửi nhưng không phụ thuộc Notification Center. |',
           '| TC-US09-013 | Locked-account notice | U2 bị Account Lock | U2 thử đăng nhập; kiểm tra push nếu thiết bị cho phép | Không vào app; thấy lock status + reason + **1800 1166 (miễn phí, hỗ trợ 24/7)** và hướng dẫn appeal; push có thể được gửi nhưng không phụ thuộc Notification Center. |')]
          for a,b in pairs: repl(p,a,b)

          # C169 — rename display badge Fan trung thành -> Fan kỳ cựu.
          p='EP05_TANG_TRUONG_VA_PHAN_TICH/US17_HUY_HIEU_NGUOI_DUNG.md'
          repl(p,
               '#### Fan trung thành (⚠️ CẦN PO XÁC NHẬN: đề xuất đổi tên hiển thị thành "Fan kỳ cựu" để giảm trùng nghĩa cảm xúc với "Fan tích cực" — đây là thay đổi tên hiển thị, không nằm trong 4 quyết định đã chốt nên chỉ ghi chú đề xuất, chưa đổi cứng tên trong tài liệu)',
               '#### Fan kỳ cựu')
          for fp in [p,'EP02_TUONG_TAC_CONG_DONG/US07_LIKE_VA_UNLIKE_BINH_LUAN.md','REQUIREMENTS_A11Y_SECURITY.md','README.md']:
              q=Path(fp); t=q.read_text(encoding='utf-8'); q.write_text(t.replace('Fan trung thành','Fan kỳ cựu'),encoding='utf-8')

          # README final summary / cross-rules.
          p='README.md'
          pairs=[
          ('- Nickname đổi có quota riêng theo Quy tắc nghiệp vụ US04/US11 (đề xuất: tối đa 1 lần/24 giờ). ⚠️ **CẦN PO XÁC NHẬN:** con số cụ thể — xem US04 mục Quy tắc nghiệp vụ.',
           '- Nickname đổi tối đa **1 lần thành công/24 giờ/account** theo US04; submission bị validation/AI chặn không tiêu quota.'),
          ('- **Khóa bình luận chặn Edit mới** nhưng user vẫn được **self-delete** content của mình.',
           '- **Khóa bình luận chặn Edit mới** nhưng user vẫn được **self-delete** content của mình. Mỗi comment/reply có **Edit rate limit riêng tối đa 5 lần sửa/phút/target**; vượt ngưỡng bị chặn trước khi tạo version/gọi AI.'),
          ('- Account Lock không cho user vào MyTV; login dừng ở màn hình khóa hiển thị **status + reason + hướng dẫn gọi Support/CSKH để appeal**. Có thể push nếu thiết bị nhận được; không phụ thuộc Notification Center trong app.',
           '- Account Lock không cho user vào MyTV; login dừng ở màn hình khóa hiển thị **status + reason + Tổng đài MyTV 1800 1166 (miễn phí, hỗ trợ 24/7) để appeal**. Có thể push nếu thiết bị nhận được; không phụ thuộc Notification Center trong app.'),
          ('- **Account Lock: appeal qua điện thoại Support/CSKH; Support chuyển appeal vào CMS**, vì user không vào được app.',
           '- **Account Lock: appeal qua Tổng đài MyTV 1800 1166 (miễn phí, hỗ trợ 24/7); Support/CSKH chuyển appeal vào CMS**, vì user không vào được app.'),
          ('- **Không còn blocker PO đang mở trong 20 User Story sau vòng review và đồng bộ quyết định đến Câu 165.**',
           '- **Không còn blocker PO đang mở trong 20 User Story sau vòng review và đồng bộ quyết định đến Câu 169.**\n- Bốn mục mở từ gói rà soát đã chốt: nickname **1 lần/24h**, Edit **5 lần/phút/target**, Account Lock dùng **1800 1166 — miễn phí, 24/7**, và tên badge **Fan kỳ cựu**.')]
          for a,b in pairs: repl(p,a,b)

          # Final validation across Markdown backlog.
          forbidden=['CẦN PO XÁC NHẬN','{hotline}','{giờ trực}','Fan trung thành','{5} lần sửa']
          bad=[]
          for md in Path('.').rglob('*.md'):
              txt=md.read_text(encoding='utf-8')
              for s in forbidden:
                  if s in txt: bad.append(f'{md}: {s}')
          if bad:
              raise SystemExit('Final validation failed:\n'+'\n'.join(bad))

          # Self-remove this one-shot workflow from final tree.
          Path('.github/workflows/finalize-mytv-po.yml').unlink()
          PY
      - name: Commit final backlog
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize MyTV Comment PO decisions C166-C169"
          git push origin HEAD:main
